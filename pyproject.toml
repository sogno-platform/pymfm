[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "pymfm"
authors = [
    { name = "Institute for Automation of Complex Power Systems (ACS), E.ON Energy Research Center (E.ON ERC), RWTH Aachen University", email = "post_acs@eonerc.rwth-aachen.de" },
]
description = "A Python framework for microgrid flexibility management."
requires-python = ">=3.10"
keywords = []
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "pandas==2.3.3",
    "pyomo==6.10.0",
    "matplotlib==3.10.8",
    "scipy==1.15.3",
    "xlsxwriter==3.2.9",
    "pydantic~=2.12",
    "astral==3.2",
    "sqlalchemy~=2.0",
    "psycopg2-binary>=2.9"
]
version = "0.6.1"
dynamic = ["readme"]

[tool.setuptools]
zip-safe = false
platforms = ["any"]

[tool.setuptools.dynamic]
readme = { file = ["README.md"], content-type = "text/markdown" }

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
service = ["fastapi[standard]~=0.135", "werkzeug~=3.1", "redis~=7.4"]


